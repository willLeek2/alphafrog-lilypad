# AlphaFrog lilypad 静态站点 nginx 配置
# 用法：
#   1. 把此文件复制到服务器的 /etc/nginx/sites-available/alphafrog-lilypad
#   2. ln -s /etc/nginx/sites-available/alphafrog-lilypad /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo nginx -s reload
#
# 注意：
#   - 以下 root 路径仅为示例，部署时请按实际服务器目录修改
#   - 本配置不包含后端 API 反代，如需添加请另行配置

server {
    listen 80;
    server_name alpha.frogwch.com;

    # lilypad build 产物目录（部署时按实际情况修改）
    root /var/www/alphafrog-lilypad/dist;
    index index.html;

    # Client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name frogwch.com www.frogwch.com;

    # 个人主页目录（部署时按实际情况修改）
    root /var/www/frogwch-personal;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
